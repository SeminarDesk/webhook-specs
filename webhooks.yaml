            - $ref: '#/components/schemas/NumericIdPayload'

    CertificateVoidRequest:
      allOf:
        - $ref: '#/components/schemas/AbstractWebhookRequest'
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/CertificateVoidNotification'

    CertificateVoidNotification:
      allOf:
        - $ref: '#/components/schemas/AbstractNotification'
      type: object
      required: [payload]
      properties:
        action:
          type: string
          enum: ['certificate.void']
        payload:
          oneOf:
            - $ref: '#/components/schemas/CertificatePayload'
            - $ref: '#/components/schemas/NumericIdPayload'

    EventPayload:
      type: object
      required: [id, title, subtitle, teaser, description, headerPictureUrl, teaserPictureUrl, bookingPageUrl, infoDatesPrices, infoBoardLodging, infoMisc, facilitators, contactPersons, registrationAvailable, detailpageAvailable, previewAvailable, labels, datesAreCoherent]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        title:
          $ref: '#/components/schemas/LocalizedString'
        subtitle:
          $ref: '#/components/schemas/LocalizedString'
        teaser:
          $ref: '#/components/schemas/LocalizedString'
        description:
          $ref: '#/components/schemas/LocalizedString'
        headerPictureUrl:
          $ref: '#/components/schemas/LocalizedString'
        teaserPictureUrl:
          $ref: '#/components/schemas/LocalizedString'
        bookingPageUrl:
          description: The URL of the booking page for this event. Empty when the event has no detail page.
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
        externalRegistrationUrl:
          description: The URL of an external registration. Filled only when the event has a detail page without registration.
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
        infoDatesPrices:
          $ref: '#/components/schemas/LocalizedString'
        infoBoardLodging:
          $ref: '#/components/schemas/LocalizedString'
        infoBoard:
          $ref: '#/components/schemas/LocalizedString'
        infoMisc:
          $ref: '#/components/schemas/LocalizedString'
        facilitators:
          description: Empty when the event does not show its facilitators.
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '#/components/schemas/NumericPrimaryKey'
        contactPersons:
          description: Empty when the event does not show its contact information.
          type: array
          items:
            $ref: '#/components/schemas/ContactPerson'
        contactInfo:
          type: string
        registrationAvailable:
          type: boolean
        detailpageAvailable:
          type: boolean
        previewAvailable:
          type: boolean
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        additionalFields:
          description: Filled only when additional fields are enabled for the webhook payload in the settings.
          type: array
          items:
            $ref: '#/components/schemas/AdditionalField'
        color:
          type: string
          nullable: true
        datesAreCoherent:
          description: Determines whether this event is marked as "multi-part"
          type: boolean
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'
        availability:
          description: Determines until when the dates of this event should be available for booking
          type: string
          enum: ['UNTIL_BEFORE_FIRST_DATE', 'UNTIL_AFTER_FIRST_DATE', 'UNTIL_BEFORE_LAST_DATE', 'UNTIL_AFTER_LAST_DATE']
          nullable: true
        childrenAllowed:
          type: boolean
        showAttendanceFees:
          type: boolean
        onlyBoardAndLodging:
          type: boolean
        showFacilitators:
          type: boolean
        showNewsletterCheckbox:
          type: boolean
        allowVoucher:
          type: boolean
        requireOnlinePayment:
          type: boolean
          default: false

    EventDatePayload:
      type: object
      required: [id, eventId, status, beginDate, endDate, title, attendanceType, facilitators]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        eventId:
          $ref: '#/components/schemas/EventId'
        bookingPageStatus:
          type: string
          enum:
            - 'available'
            - 'limited'
            - 'fully_booked'
            - 'wait_list'
            - 'hidden_on_list'
            - 'hidden'
            - 'canceled'
          nullable: true
        status:
          type: object
          required: [name, bookingAllowed, isCanceled]
          properties:
            name:
              type: string
            bookingAllowed:
              type: boolean
            isCanceled:
              type: boolean
        beginDate:
          $ref: '#/components/schemas/Timestamp'
        endDate:
          $ref: '#/components/schemas/Timestamp'
        registrationStart:
          description: Epoch timestamp in milliseconds
          type: integer
          format: int64
          nullable: true
          example: 1602144000000
        registrationEnd:
          description: Epoch timestamp in milliseconds
          type: integer
          format: int64
          nullable: true
          example: 1602144000000
        publishedFrom:
          description: Epoch timestamp in milliseconds
          type: integer
          format: int64
          nullable: true
          example: 1602144000000
        publishedUntil:
          description: Epoch timestamp in milliseconds
          type: integer
          format: int64
          nullable: true
          example: 1602144000000
        title:
          $ref: '#/components/schemas/LocalizedString'
        priceInfo:
          description: Contains an empty value when the event does not show its attendance fees.
          allOf:
            - $ref: '#/components/schemas/LocalizedString'
        additionalPriceInfo:
          $ref: '#/components/schemas/LocalizedString'
        venue:
          $ref: '#/components/schemas/Venue'
        labels:
          description: The labels of the event and of this date.
          type: array
          items:
            $ref: '#/components/schemas/Label'
        additionalFields:
          description: Filled only when additional fields are enabled for the webhook payload in the settings.
          type: array
          items:
            $ref: '#/components/schemas/AdditionalField'
        allowFlexibleAttendance:
          type: boolean
        attendanceStartUntil:
          type: string
          format: date
          nullable: true
        attendanceEndFrom:
          type: string
          format: date
          nullable: true
        minAttendanceLength:
          type: integer
        maxAttendanceLength:
          type: integer
        earlyArrivalMode:
          $ref: '#/components/schemas/EarlyArrivalMode'
        lateDepartureMode:
          $ref: '#/components/schemas/LateDepartureMode'
        hasBoard:
          type: boolean
        hasLodging:
          type: boolean
        boardOptional:
          type: boolean
        lodgingOptional:
          type: boolean
        attendanceType:
          type: string
          enum: ['ONLINE', 'ON_SITE', 'SELECTABLE']
        facilitators:
          type: array
          items:
            $ref: '#/components/schemas/EventDateFacilitator'
        number:
          type: string
          nullable: true
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'
        additionalInfo:
          $ref: '#/components/schemas/LocalizedString'

    EventDateFacilitator:
      type: object
      required: [id, name, order]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        name:
          type: string
          description: Full name of the profile (including title, if any)
        additionalInfo:
          $ref: '#/components/schemas/LocalizedString'
        order:
          type: integer

    EarlyArrivalMode:
      type: integer
      enum: [0, 1, 2, 3]

    LateDepartureMode:
      type: integer
      enum: [0, 1, 2, 3]

    FacilitatorPayload:
      type: object
      required: [id, name, lastName, about, qualifications, isPublic]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        salutation:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        name:
          type: string
          description: Full name of the profile
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
        about:
          $ref: '#/components/schemas/LocalizedString'
        pictureUrl:
          type: string
          format: uri
          nullable: true
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/NamedIdReference'
        remarks:
          type: string
          nullable: true
        isPublic:
          type: boolean

    ProfilePayload:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PersonProfile'
        - $ref: '#/components/schemas/OrganizationProfile'
      discriminator:
        propertyName: objectType
        mapping:
          PERSON: '#/components/schemas/PersonProfile'
          ORGANIZATION: '#/components/schemas/OrganizationProfile'

    ProfileMergePayload:
      description: The kept profile (`mergeStatus` `MERGED`) and the removed profile (`mergeStatus` `DELETED`).
      type: array
      minItems: 2
      maxItems: 2
      items:
        $ref: '#/components/schemas/ProfilePayload'

    PersonProfile:
      type: object
      required: [lastName]
      allOf:
        - $ref: '#/components/schemas/AbstractProfile'
      properties:
        title:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
        additionalTitle:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        profession:
          type: string
          nullable: true
        salutationType:
          type: string
          enum: [FORMAL, INFORMAL]
        privatePhoneNumber:
          type: string
          nullable: true
        alternativePhoneNumber:
          type: string
          nullable: true
        workPhoneNumber:
          type: string
          nullable: true
        preferredAddress:
          type: string
          enum: [PRIVATE, INVOICE, PRIMARY_ORGANIZATION]
        preferredEmail:
          type: string
          enum: [PRIVATE, ALTERNATIVE, INVOICE, PRIMARY_ORGANIZATION]
        preferredPhoneNumber:
          type: string
          enum: [PRIVATE, ALTERNATIVE, BUSINESS, PRIMARY_ORGANIZATION]
        preferredBillingAddress:
          type: string
          enum: [PRIVATE, INVOICE, PRIMARY_ORGANIZATION]
        preferredInvoiceEmail:
          type: string
          enum: [PRIVATE, ALTERNATIVE, INVOICE, PRIMARY_ORGANIZATION]
        isSubscribedToNewsletter:
          type: boolean
        isFacilitator:
          type: boolean

    OrganizationProfile:
      type: object
      allOf:
        - $ref: '#/components/schemas/AbstractProfile'
      properties:
        additionalName:
          type: string
          nullable: true
        preferredBillingAddress:
          type: string
          enum: [BUSINESS, INVOICE]
        preferredInvoiceEmail:
          type: string
          enum: [BUSINESS, ALTERNATIVE, INVOICE]

    AbstractProfile:
      type: object
      required: [id, objectType, salutation, name]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        mergeStatus:
          description: Present only in `profile.merge` notifications.
          type: string
          enum: [MERGED, DELETED]
        objectType:
          type: string
          enum: [PERSON, ORGANIZATION]
        salutation:
          type: string
          nullable: true
        name:
          type: string
        language:
          type: string
          nullable: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        email:
          type: string
          nullable: true
        alternativeEmail:
          type: string
          nullable: true
        effectiveInvoiceEmail:
          description: The email address invoices are sent to
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        faxNumber:
          type: string
          nullable: true
        primaryAddress:
          $ref: '#/components/schemas/Address'
        billingAddressActive:
          type: boolean
        billingAddress:
          $ref: '#/components/schemas/BillingAddress'
        remarks:
          type: string
          nullable: true
        information:
          type: string
          nullable: true
        isBlocked:
          type: boolean
        blockedReason:
          type: string
          nullable: true
        bankAccountData:
          type: object
          properties:
            bankName:
              type: string
              nullable: true
            iban:
              type: string
              example: DE91100000000123456789
              nullable: true
            bic:
              type: string
              example: AABSDE31
              nullable: true
            accountHolder:
              type: string
              nullable: true
        taxNumber:
          type: string
          nullable: true
        vatId:
          type: string
          nullable: true
        customerNumber:
          type: string
          nullable: true
        additionalFields:
          description: Filled only when additional fields are enabled for the webhook payload in the settings.
          type: array
          items:
            $ref: '#/components/schemas/AdditionalField'
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'

    Address:
      type: object
      properties:
        careOf:
          type: string
          nullable: true
        streetAddress:
          type: string
          nullable: true
        streetAddress2:
          type: string
          nullable: true
        zipCode:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        country:
          type: object
          properties:
            code:
              description: ISO country code
              type: string
              nullable: true
            name:
              description: Country name
              type: string
              nullable: true
              example: 'Germany'
            localizedName:
              description: Country name in the language of the profile
              type: string
              nullable: true
              example: 'Allemagne'

    BillingAddress:
      allOf:
        - $ref: '#/components/schemas/Address'
        - type: object
          properties:
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true

    LabelGroupPayload:
      type: object
      required: [id, name, abbreviation, labels]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        name:
          type: string
        abbreviation:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedString'
        pictureUrl:
          $ref: '#/components/schemas/LocalizedString'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        showAsFilter:
          type: boolean

    BookingPayload:
      $ref: 'https://raw.githubusercontent.com/SeminarDesk/private-api-specs/main/private-api.json#/components/schemas/Booking'

    InvoicePayload:
      $ref: 'https://raw.githubusercontent.com/SeminarDesk/private-api-specs/main/private-api.json#/components/schemas/Invoice'

    CertificatePayload:
      $ref: 'https://raw.githubusercontent.com/SeminarDesk/private-api-specs/main/private-api.json#/components/schemas/Certificate'

    PaymentPayload:
      type: object
      required: [booking, payment]
      properties:
        booking:
          type: object
          required: [id, booker]
          properties:
            id:
              $ref: '#/components/schemas/NumericPrimaryKey'
            booker:
              $ref: '#/components/schemas/NamedIdReference'
        payment:
          type: object
          required: [id, amount, date]
          properties:
            id:
              $ref: '#/components/schemas/NumericPrimaryKey'
            amount:
              description: The amount can be a negative or positive number
              type: number
              format: double
              example: 23.42
            date:
              type: string
              format: date
            remarks:
              type: string
              nullable: true
            method:
              type: object
              nullable: true
              required: [code]
              properties:
                code:
                  description: Unique code of the payment method
                  type: string

    NumericIdPayload:
      description: Sent instead of the full payload when the webhook is not set to send extended payloads.
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'

    EventIdPayload:
      description: Sent instead of the full payload when the webhook is not set to send extended payloads.
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/EventId'

    LocalizedString:
      type: array
      items:
        type: object
        required: [language]
        properties:
          language:
            type: string
          value:
            type: string
            nullable: true
      example:
        - language: 'DE'
          value: 'Beispiel-Text'
        - language: 'EN'
          value: 'Example text'

    ContactPerson:
      type: object
      required: [firstName, lastName, phone, email]
      properties:
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        department:
          type: string
          nullable: true

    EventId:
      type: string
      description: UUID minus the `-`
      example: '37eb4c5704f8461b83dcf0723ab983e8'

    Timestamp:
      type: integer
      description: Epoch timestamp in milliseconds
      example: 1602144000000

    Label:
      type: object
      required: [id, abbreviation, name, description, pictureUrl, labelGroup]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        abbreviation:
          type: string
        name:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedString'
        pictureUrl:
          $ref: '#/components/schemas/LocalizedString'
        color:
          type: string
          nullable: true
        order:
          type: integer
        labelGroup:
          $ref: '#/components/schemas/NamedIdReference'

    AdditionalField:
      type: object
      required: [id, name, value, description, isUsed, order]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        name:
          type: string
        value:
          description: Depends on the field type. Yes/no fields send a boolean, date fields a `Timestamp`, number and currency fields a number, single-choice fields the option name, multiple-choice fields an array of option names, all other fields a string. Can be null.
        description:
          type: string
          nullable: true
        isUsed:
          type: boolean
        order:
          type: integer

    ExternalReference:
      type: object
      required: [id, system, externalId]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        system:
          $ref: '#/components/schemas/NamedIdReference'
        externalId:
          type: string
        url:
          type: string
          nullable: true

    NamedIdReference:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        name:
          type: string
          nullable: true

    Venue:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/NumericPrimaryKey'
        name:
          type: string
        street1:
          type: string
          nullable: true
        street2:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        weblink:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        directionMapUrl:
          $ref: '#/components/schemas/LocalizedString'
        remarks:
          type: string
          nullable: true
    AbstractNotification:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: ['event.create', 'event.update', 'event.delete', 'eventDate.create', 'eventDate.update', 'eventDate.delete', 'facilitator.create', 'facilitator.update', 'facilitator.delete', 'labelGroup.create', 'labelGroup.update', 'labelGroup.delete', 'profile.create', 'profile.update', 'profile.delete', 'profile.merge', 'booking.create', 'booking.update', 'booking.changestatus', 'booking.delete', 'invoice.post', 'invoice.cancel', 'payment.create', 'payment.delete', 'certificate.create', 'certificate.update', 'certificate.finalize', 'certificate.void']

    AbstractWebhookRequest:
      description: |
        One request can carry notifications of several actions: publishing an event sends `event.create` together with an `eventDate.create` for each of its published dates, and "Send all items" in the webhook settings sends all current items in one request.
        Depending on the webhook setting "extended payload", each notification carries either the full payload or only the id of the changed object.
      type: object
      required: [id, attempt, properties, notifications]
      properties:
        id:
          type: string
          example: '9c74c8d4896d4e45906d956902a99f75'
        attempt:
          type: integer
          example: 1
        properties:
          type: object
          properties:
            timestamp:
              $ref: '#/components/schemas/Timestamp'
            extendedPayload:
              description: Whether the notifications carry the full payload (`true`) or only the id (`false` or missing)
              type: boolean
            sender:
              type: string
              example: 'SeminarDesk'

    NumericPrimaryKey:
      type: integer
      format: int64
      example: 42
