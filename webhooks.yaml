openapi: 3.0.3
info:
  version: v1
  title: SeminarDesk Webhooks
  contact:
    name: SeminarDesk support
    url: https://www.seminardesk.de
    email: support@seminardesk.de
paths: {}

components:
  callbacks:
    'event.create':
      'ExampleCallbackUrl':
        description: 'Will be called when an event is published.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventCreateRequest'
          responses:
            200:
              description: OK
    'event.update':
      'ExampleCallbackUrl':
        description: 'Will be called when a published event is updated.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventUpdateRequest'
          responses:
            200:
              description: OK
    'event.delete':
      'ExampleCallbackUrl':
        description: 'Will be called when a published event is deleted or unpublished.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventDeleteRequest'
          responses:
            200:
              description: OK
    'eventDate.create':
      'ExampleCallbackUrl':
        description: 'Will be called when a new event date is created and published, and for every published date of an event that gets published.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventDateCreateRequest'
          responses:
            200:
              description: OK
    'eventDate.update':
      'ExampleCallbackUrl':
        description: 'Will be called when a published event date is updated.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventDateUpdateRequest'
          responses:
            200:
              description: OK
    'eventDate.delete':
      'ExampleCallbackUrl':
        description: 'Will be called when a published event date is deleted or unpublished, and for every published date of an event that gets unpublished.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EventDateDeleteRequest'
          responses:
            200:
              description: OK
    'facilitator.create':
      'ExampleCallbackUrl':
        description: 'Will be called when a profile becomes an active facilitator.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FacilitatorCreateRequest'
          responses:
            200:
              description: OK
    'facilitator.update':
      'ExampleCallbackUrl':
        description: 'Will be called when an active facilitator is updated.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FacilitatorUpdateRequest'
          responses:
            200:
              description: OK
    'facilitator.delete':
      'ExampleCallbackUrl':
        description: 'Will be called when a facilitator is deactivated, deleted or merged into another profile.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/FacilitatorDeleteRequest'
          responses:
            200:
              description: OK
    'labelGroup.create':
      'ExampleCallbackUrl':
        description: 'Will be called when a label group is created or becomes public and usable for events.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/LabelGroupCreateRequest'
          responses:
            200:
              description: OK
    'labelGroup.update':
      'ExampleCallbackUrl':
        description: 'Will be called when a public event label group or one of its labels is updated, or a label is deleted.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/LabelGroupUpdateRequest'
          responses:
            200:
              description: OK
    'labelGroup.delete':
      'ExampleCallbackUrl':
        description: 'Will be called when a public event label group is deleted, or is no longer public or usable for events.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/LabelGroupDeleteRequest'
          responses:
            200:
              description: OK
    'profile.create':
      'ExampleCallbackUrl':
        description: 'Will be called when a new profile is created that is not a facilitator. A new facilitator fires `facilitator.create` instead.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProfileCreateRequest'
          responses:
            200:
              description: OK
    'profile.update':
      'ExampleCallbackUrl':
        description: 'Will be called when a profile that is not a facilitator is updated.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProfileUpdateRequest'
          responses:
            200:
              description: OK
    'profile.delete':
      'ExampleCallbackUrl':
        description: 'Will be called when a profile is deleted. The full payload shows the profile as it was before the deletion.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProfileDeleteRequest'
          responses:
            200:
              description: OK
    'profile.merge':
      'ExampleCallbackUrl':
        description: 'Will be called when two profiles are merged. The full payload contains both profiles: the kept one with `mergeStatus` `MERGED` and the removed one with `mergeStatus` `DELETED`. The id-only payload carries the id of the kept profile. The kept profile already shows the merged data.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProfileMergeRequest'
          responses:
            200:
              description: OK
    'booking.create':
      'ExampleCallbackUrl':
        description: 'Will be called when a new booking is created.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/BookingCreateRequest'
          responses:
            200:
              description: OK
    'booking.update':
      'ExampleCallbackUrl':
        description: 'Will be called when a booking is updated.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/BookingUpdateRequest'
          responses:
            200:
              description: OK
    'booking.changestatus':
      'ExampleCallbackUrl':
        description: 'Will be called when a booking''s status is changed.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/BookingStatusChangeRequest'
          responses:
            200:
              description: OK
    'booking.delete':
      'ExampleCallbackUrl':
        description: 'Will be called when a booking is deleted.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/BookingDeleteRequest'
          responses:
            200:
              description: OK
    'invoice.post':
      'ExampleCallbackUrl':
        description: 'Will be called when an invoice is posted. Draft invoices fire no event.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/InvoicePostRequest'
          responses:
            200:
              description: OK
    'invoice.cancel':
      'ExampleCallbackUrl':
        description: 'Will be called when an invoice is canceled. The payload is the canceled invoice, not the cancelation invoice.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/InvoiceCancelRequest'
          responses:
            200:
              description: OK
    'payment.create':
      'ExampleCallbackUrl':
        description: 'Will be called when a payment is added to a booking. The id-only payload carries the id of the payment, not of the booking.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PaymentCreateRequest'
          responses:
            200:
              description: OK
    'payment.delete':
      'ExampleCallbackUrl':
        description: 'Will be called when a payment is removed from a booking. The id-only payload carries the id of the payment, not of the booking.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PaymentDeleteRequest'
          responses:
            200:
              description: OK
    'certificate.create':
      'ExampleCallbackUrl':
        description: 'Will be called when a certificate is created as a draft.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CertificateCreateRequest'
          responses:
            200:
              description: OK
    'certificate.update':
      'ExampleCallbackUrl':
        description: 'Will be called when a finalized certificate is updated.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CertificateUpdateRequest'
          responses:
            200:
              description: OK
    'certificate.finalize':
      'ExampleCallbackUrl':
        description: 'Will be called when a certificate is finalized, or created without being a draft.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CertificateFinalizeRequest'
          responses:
            200:
              description: OK
    'certificate.void':
      'ExampleCallbackUrl':
        description: 'Will be called when a certificate is voided.'
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CertificateVoidRequest'
          responses:
            200:
              description: OK

  schemas:
    EventCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AbstractWebhookRequest'
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/EventCreateNotification'

    EventCreateNotification:
      allOf:
        - $ref: '#/components/schemas/AbstractNotification'
      type: object
      required: [payload]
      properties:
        action:
          type: string
          enum: ['event.create']
        payload:
          oneOf:
            - $ref: '#/components/schemas/EventPayload'
            - $ref: '#/components/schemas/EventIdPayload'

    EventUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AbstractWebhookRequest'
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/EventUpdateNotification'

    EventUpdateNotification:
